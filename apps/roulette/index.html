  <title>ルーレット | n-apps</title>
  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-nav">
    <div class="site-nav-bar">
      <a class="site-nav-brand" href="../../index.html">n-apps</a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">
        <span class="nav-toggle-icon"></span>
        メニュー
      </button>
    </div>
    <nav id="navMenu" class="nav-menu" hidden>
      <a href="../../index.html">トップページ</a>

      <a href="../roulette/index.html">ルーレット</a>
      <a href="../../privacy/index.html">プライバシーポリシー</a>
    </nav>
  </header>

  <main class="roulette-app">
    <h1>ルーレット</h1>
    <p class="description">項目を登録して、ルーレットでランダムに1つ選びます</p>

    <div class="wheel-area">
      <div class="wheel-pointer"></div>
      <div class="wheel-wrap">
        <svg id="wheelSvg" class="wheel" viewBox="0 0 200 200" width="280" height="280">
          <circle cx="100" cy="100" r="94" class="wheel-outline"></circle>
          <g id="wheelSlices"></g>
        </svg>
      </div>
    </div>

    <button id="spinBtn" class="btn btn-primary" type="button">ルーレットを回す</button>
    <p id="resultText" class="result-text"></p>

    <div class="settings">
      <div class="setting-group">
        <p class="setting-label">登録した項目</p>
        <form id="itemForm" class="item-form">
          <input type="text" id="itemInput" placeholder="項目を入力" autocomplete="off" maxlength="20">
          <button type="submit" class="btn btn-small">追加</button>
        </form>
        <ul class="item-list" id="itemList"></ul>
        <button id="clearItemsBtn" class="btn btn-small" type="button">全て削除</button>
      </div>
    </div>
  </main>

  <script src="../../js/header.js"></script>
  <script src="script.js"></script>
</body>
</html>
