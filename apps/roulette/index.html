<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

    if (location.pathname.endsWith("/index.html")) {
      location.replace(location.pathname.slice(0, -"index.html".length) + location.search + location.hash);
    }
  </script>
  <link rel="canonical" href="./">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V08S2K6KE4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V08S2K6KE4');
  </script>

  <title>ルーレット | n-apps</title>
  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-nav">
    <div class="site-nav-bar">
      <a class="site-nav-brand" href="../../">n-apps</a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">
        <span class="nav-toggle-icon"></span>
        メニュー
      </button>
    </div>
    <nav id="navMenu" class="nav-menu" hidden>
      <a href="../../">トップページ</a>
      <a href="../interval-timer/">インターバルタイマー</a>
      <a href="../youtube-thumbnail/">YouTubeサムネイル抽出</a>
      <a href="../roulette/">ルーレット</a>
      <a href="../select-generator/">selectタグ生成</a>
      <a href="../../privacy/">プライバシーポリシー</a>
    </nav>
  </header>

  <main class="roulette-app">
    <h1>ルーレット</h1>
    <p class="description">項目を登録して、ルーレットでランダムに1つ選びます</p>

    <div class="wheel-area">
      <div class="wheel-pointer"></div>
      <div class="wheel-wrap">
        <svg id="wheelSvg" class="wheel" viewBox="0 0 200 200" width="280" height="280">
          <circle cx="100" cy="100" r="94" class="wheel-outline"></circle>
          <g id="wheelSlices"></g>
        </svg>
      </div>
    </div>

    <button id="spinBtn" class="btn btn-primary" type="button">ルーレットを回す</button>
    <p id="resultText" class="result-text"></p>

    <div class="settings">
      <div class="setting-group">
        <p class="setting-label">登録した項目</p>
        <form id="itemForm" class="item-form">
          <input type="text" id="itemInput" placeholder="項目を入力" autocomplete="off" maxlength="20">
          <button type="submit" class="btn btn-small">追加</button>
        </form>
        <ul class="item-list" id="itemList"></ul>
        <button id="clearItemsBtn" class="btn btn-small" type="button">全て削除</button>
      </div>
    </div>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4538219357223464"
         crossorigin="anonymous"></script>
    <!-- サイドAds -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-4538219357223464"
         data-ad-slot="3885286230"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </main>

  <script src="../../js/header.js"></script>
  <script src="script.js"></script>
</body>
</html>
