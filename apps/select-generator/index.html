  <main class="app">
    <h1>selectタグ生成</h1>
    <p class="description">よく使うHTMLの&lt;select&gt;タグをボタン1つでコピーできます</p>

    <section class="select-block">
      <h2>都道府県</h2>
      <div class="order-toggle">
        <label><input type="radio" name="prefValueFormat" value="kanji" checked> valueを漢字（例: 北海道）</label>
        <label><input type="radio" name="prefValueFormat" value="romaji"> valueをローマ字（例: hokkaido）</label>
        <label><input type="radio" name="prefValueFormat" value="code"> valueを数字2桁（例: 01）</label>
      </div>
      <select id="prefPreview" class="preview-select"></select>
      <pre class="code-block" id="prefCode"></pre>
      <button class="btn" type="button" data-copy-target="prefCode">コピー</button>
    </section>

    <section class="select-block">
      <h2>年（今年から80年）</h2>
      <div class="order-toggle">
        <label><input type="radio" name="yearOrder" value="desc" checked> 降順（新しい年→古い年）</label>
        <label><input type="radio" name="yearOrder" value="asc"> 昇順（古い年→新しい年）</label>
      </div>
      <select id="yearPreview" class="preview-select"></select>
      <pre class="code-block" id="yearCode"></pre>
      <button class="btn" type="button" data-copy-target="yearCode">コピー</button>
    </section>

    <section class="select-block">
      <h2>月（1〜12月）</h2>
      <select id="monthPreview" class="preview-select"></select>
      <pre class="code-block" id="monthCode"></pre>
      <button class="btn" type="button" data-copy-target="monthCode">コピー</button>
    </section>

    <section class="select-block">
      <h2>日（1〜31日）</h2>
      <select id="dayPreview" class="preview-select"></select>
      <pre class="code-block" id="dayCode"></pre>
      <button class="btn" type="button" data-copy-target="dayCode">コピー</button>
    </section>
