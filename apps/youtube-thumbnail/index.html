<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- index.html を末尾に含むURLを、ディレクトリURLへ正規化する -->
  <script>
    if (location.pathname.endsWith("/index.html")) {
      location.replace(location.pathname.slice(0, -"index.html".length) + location.search + location.hash);
    }
  </script>
  <link rel="canonical" href="./">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V08S2K6KE4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V08S2K6KE4');
  </script>

  <title>YouTubeサムネイル抽出 | n-apps</title>
  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-nav">
    <div class="site-nav-bar">
      <a class="site-nav-brand" href="../../">n-apps</a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">
        <span class="nav-toggle-icon"></span>
        メニュー
      </button>
    </div>
    <nav id="navMenu" class="nav-menu" hidden>
      <a href="../../">トップページ</a>
      <a href="../interval-timer/">インターバルタイマー</a>
      <a href="../youtube-thumbnail/">YouTubeサムネイル抽出</a>
      <a href="../roulette/">ルーレット</a>
      <a href="../select-generator/">selectタグ生成</a>
      <a href="../../privacy/">プライバシーポリシー</a>
    </nav>
  </header>

  <main class="app">
    <h1>YouTubeサムネイル抽出</h1>
    <p class="description">YouTubeのURLを入力すると、全サイズのサムネイル画像を表示します</p>

    <form id="thumbnailForm" class="url-form">
      <input
        type="text"
        id="urlInput"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
      >
      <button type="submit" class="btn btn-primary">取得</button>
    </form>

    <p id="errorMessage" class="error-message" hidden></p>

    <div id="resultArea" class="result-area" hidden>
      <p class="video-id">Video ID: <code id="videoIdText"></code></p>
      <div id="thumbnailGrid" class="thumbnail-grid"></div>
    </div>
  </main>

  <script src="../../js/header.js"></script>
  <script src="script.js"></script>
</body>
</html>
