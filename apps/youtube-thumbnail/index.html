<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTubeサムネイル抽出 | n-apps</title>
  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-nav">
    <div class="site-nav-bar">
      <a class="site-nav-brand" href="../../index.html">n-apps</a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">
        <span class="nav-toggle-icon"></span>
        メニュー
      </button>
    </div>
    <nav id="navMenu" class="nav-menu" hidden>
      <a href="../../index.html">トップページ</a>
      <a href="../interval-timer/index.html">インターバルタイマー</a>
      <a href="../youtube-thumbnail/index.html">YouTubeサムネイル抽出</a>
    </nav>
  </header>

  <main class="app">
    <h1>YouTubeサムネイル抽出</h1>
    <p class="description">YouTubeのURLを入力すると、全サイズのサムネイル画像を表示します</p>

    <form id="thumbnailForm" class="url-form">
      <input
        type="text"
        id="urlInput"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
      >
      <button type="submit" class="btn btn-primary">取得</button>
    </form>

    <p id="errorMessage" class="error-message" hidden></p>

    <div id="resultArea" class="result-area" hidden>
      <p class="video-id">Video ID: <code id="videoIdText"></code></p>
      <div id="thumbnailGrid" class="thumbnail-grid"></div>
    </div>
  </main>

  <script src="../../js/header.js"></script>
  <script src="script.js"></script>
</body>
</html>
