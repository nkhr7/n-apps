<body>
  <header class="site-nav">
    <div class="site-nav-bar">
      <a class="site-nav-brand" href="../../">n-apps</a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">

        メニュー
      </button>
    </div>
    <nav id="navMenu" class="nav-menu" hidden>
      <a href="../../">トップページ</a>
      <a href="../interval-timer/">インターバルタイマー</a>
      <a href="../youtube-thumbnail/">YouTubeサムネイル抽出</a>

      <a href="../select-generator/">selectタグ生成</a>
      <a href="../../privacy/">プライバシーポリシー</a>
    </nav>

  <main class="timer-app">
    <h1>インターバルタイマー</h1>
    <p class="description">複数の間隔をループしながら音が鳴ります</p>

    <div class="time-display" id="timeDisplay">05:00</div>
    <p class="current-interval" id="currentIntervalLabel">1 / 1 &middot; 5分</p>

    <div class="controls">
      <button id="toggleBtn" class="btn btn-primary">再生</button>
      <button id="resetBtn" class="btn">リセット</button>
      <button id="tabTitleToggleBtn" class="btn" type="button">タイマーをタブに表示</button>
    </div>

    <div class="settings">
      <div class="setting-group">
        <p class="setting-label">間隔（ループ）</p>
        <ul class="interval-list" id="intervalList"></ul>
        <button id="addIntervalBtn" class="btn btn-small" type="button">時間追加</button>
      </div>

      <div class="setting-row">
        <label for="soundSelect">音の種類</label>
        <select id="soundSelect">
          <option value="bell" selected>ベル</option>
          <option value="chime">チャイム</option>
          <option value="beep">ビープ</option>
          <option value="alarm">アラーム</option>
        </select>
        <button id="previewBtn" class="btn btn-small" type="button">試聴</button>
      </div>

      <div class="setting-row">
        <label for="volumeRange">音量</label>
        <input type="range" id="volumeRange" min="0" max="100" value="50">
        <span id="volumeValue">50</span>
      </div>
    </div>
  </main>
