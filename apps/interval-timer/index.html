<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インターバルタイマー | n-apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; トップページに戻る</a>

  <main class="timer-app">
    <h1>インターバルタイマー</h1>
    <p class="description">設定した間隔で音が鳴ります</p>

    <div class="time-display" id="timeDisplay">00:00</div>
    <p class="next-chime" id="nextChime">次の音まで 05:00</p>

    <div class="controls">
      <button id="toggleBtn" class="btn btn-primary">再生</button>
      <button id="resetBtn" class="btn">リセット</button>
    </div>

    <div class="settings">
      <div class="setting-row">
        <label for="intervalSelect">間隔</label>
        <select id="intervalSelect">
          <option value="1">1分</option>
          <option value="3">3分</option>
          <option value="5" selected>5分</option>
          <option value="10">10分</option>
          <option value="15">15分</option>
          <option value="20">20分</option>
          <option value="30">30分</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="soundSelect">音の種類</label>
        <select id="soundSelect">
          <option value="bell" selected>ベル</option>
          <option value="chime">チャイム</option>
          <option value="beep">ビープ</option>
          <option value="alarm">アラーム</option>
        </select>
        <button id="previewBtn" class="btn btn-small" type="button">試聴</button>
      </div>

      <div class="setting-row">
        <label for="volumeRange">音量</label>
        <input type="range" id="volumeRange" min="0" max="100" value="50">
        <span id="volumeValue">50</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
